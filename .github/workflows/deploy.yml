name: Deploy DDPro to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Resolve API URL
        id: api_url
        run: |
          API_URL="${{ vars.VITE_API_URL }}"

          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable VITE_API_URL is required for production deployment."
            exit 1
          fi

          case "$API_URL" in
            https://*)
              ;;
            *)
              echo "::error::VITE_API_URL must be an https URL."
              exit 1
              ;;
          esac

          echo "::notice::Using configured production API origin."
          echo "value=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test production API
        run: |
          API_URL="${{ steps.api_url.outputs.value }}"
          curl --fail --silent --show-error \
            --max-time 20 \
            --retry 3 \
            --retry-connrefused \
            "${API_URL}/health" > /tmp/ddpro-health.json
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/ddpro-health.json","utf8")); if(!data || !data.service || !["ok","degraded"].includes(data.status)){console.error("Unexpected health response", data); process.exit(1)} if(data.status !== "ok"){console.error("Backend health is not ready", data); process.exit(1)} console.log("Health OK:", data.service);'

      - name: Build DDPro
        run: npm run build
        env:
          VITE_API_URL: ${{ steps.api_url.outputs.value }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
