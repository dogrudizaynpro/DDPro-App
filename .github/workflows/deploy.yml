name: Deploy DDPro to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Resolve API URL
        id: api_url
        run: |
          API_URL="${{ vars.VITE_API_URL }}"

          if [ -z "$API_URL" ]; then
            API_URL="${{ secrets.VITE_API_URL }}"
          fi

          if [ -z "$API_URL" ]; then
            echo "::warning::VITE_API_URL is not set. Continuing without an injected API URL; configure it for production runtime."
          else
            echo "::add-mask::$API_URL"
          fi

          echo "value=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Build DDPro
        run: npm run build
        env:
          VITE_API_URL: ${{ steps.api_url.outputs.value }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
